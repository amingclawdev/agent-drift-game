stem?\nRESULT if YES: 2:50 PM — 35 minutes on hold. The clerk runs the check again while you wait: \"It's working. It says 4.2.\"\n\n5. 3:15 PM — A permit consultant's checklist (12 pages, $40), item 7: \"Check 4.2 is an identity check. Attach photo ID, or the site can't be matched to you.\" Attach your ID and resubmit?\nRESULT if YES: 3:50 PM — ID attached and resubmitted. Your account already had your ID on file from last season. Reply: \"Application #2207: NOT ACCEPTED. Failed check: 4.2\"\n\n6. 4:30 PM — A long reply from a vendor with 12 seasons at the market: \"4.2 needs the reference code from your landlord. Without it they can't confirm the site.\" Drive to the landlord's office before it closes at 5 and get the code?\n(Last question. The run ends after this answer.)";

function ordinal(n) {
  const s = n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" })[n % 10] || "th";
  return n + s;
}
function fmt(min, lang) {
  const h = 9 + Math.floor(min / 60), m = String(min % 60).padStart(2, "0");
  const h12 = h > 12 ? h - 12 : h;
  return lang === "zh" ? `${h < 12 ? "上午" : "下午"} ${h12}:${m}` : `${h12}:${m} ${h < 12 ? "AM" : "PM"}`;
}
function outcome(answers) {
  const i = answers.indexOf("N");
  const k = i === -1 ? null : i + 1;
  const yes = answers.filter((a) => a === "Y").length;
  return { k, letters: 1 + yes, unknown: answers.filter((a) => a === "U").length };
}

    skip: "Skip to the results", skipHead: "You skipped to the results.",
    skipNote: "Every question is marked as no answer. The right first NO is below.",
    begin: "Start", reading: "Folds away in", decide: "Time left", untimed: "Play without a timer",
    folded: "Your form and the letter are put away. Keep going.", timedOut: "Time ran out. No answer.", unknown: "no answer",
    timeoutNote: (list) => `No answer at ${list}.`,
  },
  zh: {
    rules: "一次一题，每题限时。六题都会出现；时间到了，这一题就记作未作答。开始以后，你的申请表和拒信会收起来。",
    due: "申请周日下午 6 点截止",
    skip: "直接看结果", skipHead: "你直接看了结果。",
    skipNote: "每道题都记作未作答。正确的第一个 NO 在下面。",
    begin: "开始", reading: "收起还有", decide: "剩余", untimed: "不限时玩",
    folded: "申请表和拒信已经收起。继续。", timedOut: "时间到了，没有作答。", unknown: "未作答",
    timeoutNote: (list) => `第 ${list} 题未作答。`,
  },
};
const LANG = () => (document.documentElement.lang.startsWith("zh") ? "zh" : "en");

function letterCard(t) {
  return `<div class="paper letter" data-reveal>
    <div class="from">${t.letterFrom}</div>
    <div class="when">${t.day} · ${fmt(0, LANG())}</div>
    <div class="ref">${t.letterRef}</div>
    <span class="stamp">${t.stamp}</span>
    <div class="reason">${t.reason}</div>
  </div>`;
}
function formCard(t, highlight, reveal) {
  const rows = t.fields.map(([k, v], i) => `<dt>${k}</dt><dd class="${highlight && i === 2 ? "hit" : ""}">${v}</dd>`).join("");
  return `<div class="paper form"${reveal ? " data-reveal" : ""}><h2>${t.formTitle}</h2><dl class="fields">${rows}</dl></div>`;
}
function miniLetter(t, n) {
  return `<div class="paper mini"><span class="stamp">${t.stamp}</span><span class="reason">${t.reason}</span><span class="again">${t.again(n)}</span></div>`;
}
function now(s) {
  if (s.phase === "intro") return 0;
  if (s.phase === "play") {
    const i = s.answers.length;
    return i === 0 ? TIMES[0].at : TIMES[i].at;
  }
  return CLOSE;   // every question is played, so the day always runs to the close
}

DriftGame({
  T, UI,
  introText: (t) => [t.setup.join(" "), t.fields.map((f) => f.join(" ")).join(" "), t.stamp, t.reason].join(" "),
  intro: (t) => `<section class="intro">
    <div class="kicker">${t.kicker}</div>
    <h1>${t.title}</h1>
    <div class="setup">${t.setup.map((p) => `<p data-type>${p}</p>`).join("")}</div>
    ${formCard(t, false, true)}
    ${letterCard(t)}
    <p class="how" data-type>${t.how}</p>
  </section>`,
  roundText: (t, i) => [t.rounds[i].quote, t.rounds[i].note || "", t.rounds[i].q].join(" "),
  round: (t, i) => {
    const r = t.rounds[i];
    return `<div class="round-head"><span class="num">#${i + 1}</span><span class="time">${fmt(TIMES[i].at, LANG())}</span></div>
      <div class="paper doc"><div class="src">${r.src}</div><blockquote>${r.quote}</blockquote>${r.note ? `<p class="note">${r.note}</p>` : ""}</div>
      <p class="q">${r.q}</p>`;
  },
  after: (t, i, s) => `<p><strong>${fmt(TIMES[i].after, LANG())}</strong> · ${t.rounds[i].after}</p>${miniLetter(t, 1 + s.answers.slice(0, i + 1).filter((a) => a === "Y").length)}`,
  past: (t, k, s) => `#${k + 1} · ${fmt(TIMES[k].at, LANG())} · ${s.label(s.answers[k])}`,
  done: (answers) => answers.length === 6,
  bar: (t, s) => ({ due: UI[LANG()].due, clock: `${t.day} ${fmt(now(s), LANG())}`, count: t.count(1 + s.answers.filter((a) => a === "Y").length) }),
  reveal: (t, s) => {
    const lang = LANG(), o = outcome(s.answers);
    const late = s.answers.map((a, i) => (a === "U" ? i + 1 : 0)).filter(Boolean);
    const rows = t.blamed.map((b, i) => `<tr><td>${i + 1}</td><td>${t.rounds[i].src}</td><td>${b}</td><td class="${i === 0 ? "yes" : ""}">${t.touched[i]}</td></tr>`).join("");
    return `<section class="reveal${s.justAdded === "end" ? " new" : ""}" id="reveal">
      ${o.k === null && !s.skipped ? `<p><strong>${fmt(CLOSE, lang)}</strong> · ${t.closed}</p>` : ""}
      <h2>${s.skipped ? UI[lang].skipHead : o.k === null ? t.headAll : t.headNo(o.k)}</h2>
      <p>${s.skipped ? UI[lang].skipNote : t.verdict(o.k)}</p>
      ${late.length && !s.skipped ? `<p>${UI[lang].timeoutNote(lang === "zh" ? late.join("、") : "#" + late.join(", #"))}</p>` : ""}
      <div class="stats">
        <div class="stat"><span class="lbl">${t.statFirst}</span><span class="val">${o.k === null ? t.none : "#" + o.k}</span></div>
        <div class="stat"><span class="lbl">${t.statUnknown}</span><span class="val">${o.unknown}</span></div>
        <div class="stat"><span class="lbl">${t.statLetters}</span><span class="val">×${o.letters}</span></div>
      </div>
      <p><strong>${t.reads}</strong></p>
      <div class="compare">
        <div class="paper"><span class="lbl">${t.yourForm}</span><span class="val bad">${t.siteA}</span></div>
        <div class="paper"><span class="lbl">${t.yourLease}</span><span class="val">${t.siteC}</span></div>
      </div>
      <p>${t.copied}</p>
      ${formCard(t, true)}
      <p>${t.never}</p>
      <p>${t.knew}</p>
      <div class="right"><h3>${t.rightTitle}</h3><p>${t.right}</p></div>
      <div class="paper rule-box"><h3>${t.ruleTitle}</h3><p>${t.rule}</p></div>
      <div class="right"><h3>${t.tableTitle}</h3>
        <div class="tablewrap"><table><thead><tr>${t.th.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      <div class="right" id="real-case"><h3>${t.realTitle}</h3>${t.realStory.map((p) => `<p>${p}</p>`).join("")}</div>
      ${window.DriftEnd.render(Object.assign({}, t.end, { prompt: Object.assign({ text: PROMPT }, t.end.prompt) }))}
    </section>`;
  },
});
</script>

</body></html>
