    rule: "告诉 agent 该用哪个，撑不过一个长任务：上下文一压缩，这句话就可能没了。少几扇门才管用。留一个知道每个文件是干什么的入口，所有任务都从这里进，长得像的都归档。",
    fair: "这些文件单独看都没错，每一个都曾经是某个人在某个时候要用的那一个。可它们放在一起，每个任务都变成了考“还剩下什么”，而且错误会累积：就算每五行留下四行，五题全对也只有三分之一左右。",
    realTitle: "Entrance 漂移：告诉过它走哪扇门，最后还是在猜",
    realStory: [
      "这一局里，每个文件都打得开，每个任务都做完了，没有任何东西拦你，也没有任何东西藏起来：每一题该用哪个，说明里都写了。漂移出在挑的那一下：指令在最前面，这一周的事一件件压上去，走到一堆长得很像的文件面前，你就开始猜。",
      "这个游戏背后的真实案例是一个 AI agent 工作流。它越做越大，skill 文件夹里堆满了各个版本：到 2026 年 6 月一共有 12 个 skill，其中四个几乎同名：hn-demo、hn-demo-before-work、hn-demo-during-work、hn-demo-after-work。每一个都写了什么时候该用它，也常常明确告诉 agent 用哪一个。可任务一长，agent 为了继续干活会压缩上下文，那句指令不一定留得下来。面对四个长得很像的 skill，它就猜，常常猜错。",
      "办法不是把指令再说一遍，也不是把说明写得更长。6 月 26 日，这 12 个全部归档，只留下一个入口：一个 onboarding skill，读懂请求以后再把它带到下一步。只有一扇门，上下文怎么压缩，都没有可猜的。就像回来以后的 Dana。",
      '想亲手把一个漂了的 agent 拉回来？<a href="../challenge/">看看内测，申请试玩</a>。',
    ],
    playAgain: "再玩一次",
    end: {
      nextTitle: "接下来",
      next: [
        { title: "第二集 · 检查 4.2", desc: "七封一字不差的拒信，六份言之凿凿的资料。又一个浏览器小游戏。", href: "../ep2/play.html", cta: "开始玩" },
        { title: "第一集 · Dana 的客户汇报", desc: "周一客户会之前，冒出来十件事。又一个浏览器小游戏。", href: "../ep1/play.html", cta: "开始玩" },
        { tbc: true, title: "To be continued…", desc: "在你自己的电脑上跑一个真实的 AI 工作流，用你自己的 Claude Code 或 Codex。我们正邀请几位玩家私下试玩。", href: "../challenge/", cta: "申请内测" },
      ],
    },
  },
};

const LETTERS = "abcd";
function hits(answers) { return KEY.slice(0, SCORED).filter((k, i) => answers[i] === k).length; }
// What went out for task i: the file picked, or for the last task's "Ask Dana", the file she handed over.
function fileName(t, i, a) { const r = t.rounds[i], k = LETTERS.indexOf(a); return k >= 0 && r.files[k] ? r.sends || r.files[k][0] : null; }

const UI = {
  en: {
    rules: "One task at a time, each on a clock. You'll see all six; if time runs out, that task is marked as no answer. Dana's note folds away when you start.",
    skip: "Skip to the results", skipHead: "You skipped to the results.",
    skipNote: "Every task is marked as no answer. The files Dana meant are below.",
    begin: "Start", reading: "Folds away in", decide: "Time left", untimed: "Play without a timer",
    folded: "Dana's note is put away. Keep going.", timedOut: "Time ran out. No answer.", unknown: "no answer",
    timeoutNote: (list) => `No answer at ${list}.`,
  },
  zh: {
    rules: "一次一个任务，每个任务限时。六个任务都会出现；时间到了，这一题就记作未作答。开始以后，Dana 留的话会收起来。",
    skip: "直接看结果", skipHead: "你直接看了结果。",
    skipNote: "每个任务都记作未作答。Dana 指的是哪些文件，在下面。",
    begin: "开始", reading: "收起还有", decide: "剩余", untimed: "不限时玩",
    folded: "Dana 留的话已经收起。继续。", timedOut: "时间到了，没有作答。", unknown: "未作答",
    timeoutNote: (list) => `第 ${list} 题未作答。`,
  },
};
const LANG = () => (document.documentElement.lang.startsWith("zh") ? "zh" : "en");

// Dana's handover note: what every file is for, folder by folder, plus a few folders no task needs.
function noteSections(t) {
  const all = t.noteHeads.map((h, i) => [h, NOTE_ORDER[i].map((j) => t.dana[i][j]).join(t.sep)]).concat(t.noteExtra);
  return NOTE_SEQ.map((k) => all[k]);
}
function handover(t, reveal) {
  const secs = noteSections(t).map(([h, p]) => `<div class="sec"><h5>${h}</h5><p>${p}</p></div>`).join("");
  return `<div class="paper handover"${reveal ? " data-reveal" : ""}><div class="src">${t.noteTitle}</div><p class="open">${t.noteOpen}</p>${secs}</div>`;
}
// What you've sent this week: one line per task you picked a file for.
function sentList(t, s, upTo) {
  const items = [];
  for (let k = 0; k <= upTo; k++) { const f = fileName(t, k, s.answers[k]); if (f) items.push(`<li><span>${f}</span></li>`); }
  return `<div class="paper checklist"><div class="head"><span>${t.listHead}</span><span class="n">${items.length}</span></div><ul>${items.join("")}</ul></div>`;
}
function sentCount(answers) { return answers.filter((a) => LETTERS.includes(a)).length; }

DriftGame({
  T, UI,
  introText: (t) => [t.setup.join(" "), t.noteTitle, t.noteOpen, ...noteSections(t).flat(), t.how].join(" "),
  intro: (t) => `<section class="intro">
    <div class="kicker">${t.kicker}</div>
    <h1>${t.title}</h1>
    <div class="setup">${t.setup.map((p) => `<p data-type>${p}</p>`).join("")}</div>
    ${handover(t, true)}
    <p class="how" data-type>${t.how}</p>
  </section>`,
  roundText: (t, i) => { const r = t.rounds[i]; return [r.lead || "", r.says || "", r.task, r.folder || "", r.files.map((f) => f.join(" ")).join(" "), r.q].join(" "); },
  round: (t, i) => {
    const r = t.rounds[i];
    return `<div class="round-head"><span class="num">#${i + 1}</span><span class="time">${t.days[i]}</span></div>
      ${r.lead ? `<p class="event">${r.lead}</p>` : ""}
      ${r.says ? `<div class="paper note-card"><div class="src">Dana</div><p class="said">${r.says}</p></div>` : ""}
      <p class="event">${r.task}</p>
      <p class="q">${r.q}</p>
      ${r.folder ? `<p class="folder">${r.folder}</p>` : ""}`;
  },
  choices: (t, i) => t.rounds[i].files.map(([name, meta]) => `<span class="fname">${name}</span>${t.rounds[i].door ? (meta ? `<span class="meta">${meta}</span>` : "") : `<span class="meta">${t.edited} ${meta}</span>`}`),
  after: (t, i, s) => `<p><strong>${t.days[i]}</strong> · ${t.rounds[i].after}</p>${sentList(t, s, i)}`,
  past: (t, k, s) => `#${k + 1} · ${t.days[k]} · ${fileName(t, k, s.answers[k]) || UI[LANG()].unknown}`,
  done: (answers) => answers.length === N,
  bar: (t, s) => {
    const q = s.phase === "play" ? s.answers.length : s.phase === "intro" ? 0 : N - 1;
    return { due: t.due, clock: t.days[Math.min(q, N - 1)], count: t.count(sentCount(s.answers)) };
  },
  reveal: (t, s) => {
    const lang = LANG(), h = hits(s.answers), U = UI[lang];
    const unknown = s.answers.filter((a) => a === "U").length;
    const late = s.answers.map((a, i) => (a === "U" ? i + 1 : 0)).filter(Boolean);
    // What the note said: the line naming the file to use, and the line about the file you sent, if different.
    const cards = t.tasksShort.map((name, i) => {
      const k = LETTERS.indexOf(s.answers[i]), right = LETTERS.indexOf(KEY[i]);
      const line = (j, cls, tag) => `<li class="${cls}"><span class="tag">${tag}</span><p class="said">${t.dana[i][j]}</p></li>`;
      const rows = line(right, k === right ? "meant mine" : "meant", k === right ? t.tagBoth : t.tagMeant) + (k >= 0 && k !== right ? line(k, "mine", t.tagSent) : "");
      return `<div class="paper task"><h4>#${i + 1} · ${t.days[i]} · ${name}</h4><ul class="walk">${rows}</ul></div>`;
    }).join("");
    return `<section class="reveal${s.justAdded === "end" ? " new" : ""}" id="reveal">
      <h2>${s.skipped ? U.skipHead : t.head(h)}</h2>
      <p>${s.skipped ? U.skipNote : t.verdict(h)}</p>
      ${late.length && !s.skipped ? `<p>${U.timeoutNote(lang === "zh" ? late.join("、") : "#" + late.join(", #"))}</p>` : ""}
      <div class="stats">
        <div class="stat"><span class="lbl">${t.statHits}</span><span class="val">${h} / 5</span></div>
        <div class="stat"><span class="lbl">${t.statOdds}</span><span class="val">${t.oddsVal}</span></div>
        <div class="stat"><span class="lbl">${t.statUnknown}</span><span class="val">${unknown}</span></div>
      </div>
      <div class="right"><h3>${t.walkTitle}</h3><p>${t.walkIntro}</p></div>
      <div class="tasks">${cards}</div>
      <div class="paper note-card"><div class="src">${t.danaSays}</div><p class="said">${t.walkEnd}</p></div>
      <p><strong>${t.friday}</strong></p>
      <div class="compare">
        <div class="paper"><span class="lbl">${t.cmpA}</span><span class="big">${h} / 5</span></div>
        <div class="paper"><span class="lbl">${t.cmpB}</span><span class="big">${s.answers[5] === "a" ? "1 / 1" : "– / 1"}</span></div>
      </div>
      <div class="right"><h3>${t.rightTitle}</h3><p>${t.right}</p></div>
      <div class="paper rule-box"><h3>${t.ruleTitle}</h3><p>${t.rule}</p></div>
      <p>${t.fair}</p>
      <div class="right" id="real-case"><h3>${t.realTitle}</h3>${t.realStory.map((p) => `<p>${p}</p>`).join("")}</div>
      ${window.DriftEnd.render(t.end)}
    </section>`;
  },
});
</script>
