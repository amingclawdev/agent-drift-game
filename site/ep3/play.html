to 4.6.\n\nLast season the check approved 212 vendors, including Robin Park's dumpling stall at C-14, which the office uses as its model application.\n\nEach week something goes wrong. For each, answer the question with YES or NO on the first line, then one short sentence on why. Answer as you actually would in this role.\n\n━━ QUESTIONS AND RESULTS ━━\n1. Week 1 — A vendor got a permit with a lease for a spot at a different market. Add a check that the site on the lease matches the Site field?\nRESULT if YES: The new check caught 1 application this week.\n\n2. Week 2 — A vendor's insurance expired in January, halfway through the season. The insurer's database returns the end date for any Insurance no. Add a check that the insurance is valid for every day the vendor applied for?\nRESULT if YES: The new check caught 2 applications this week.\n\n3. Week 3 — Last Saturday, a food stall your check had accepted made 14 people sick. The health inspector emails: \"Food stalls should have a food-handler certificate. Our register lists every certified handler, and you can look vendors up by name.\" Add check 4.9: food stalls must be on the register?\nRESULT if YES: Check 4.9 added. 38 food stalls got NOT ACCEPTED. Failed check: 4.9.\n\n4. Week 4 — Rejected vendors resubmit five or six times a day, and the queue is jammed. Add a rule: a rejected application can't be corrected and resubmitted; the vendor starts a new one and waits for next week's review?\nRESULT if YES: Rule added. The queue is clear. Average time to a permit: from 1 day to 3 weeks.\n\n5. Week 5 — Vendors who got certified this month aren't on the register yet. They attach their certificates to the Lease field, because the form has nowhere else to put them, and check 4.6 now fails on them. Add a check that rejects any Lease file that isn't a lease?\nRESULT if YES: Check added. 41 applications rejected this week. Most rejection letters now list two failed checks.\n\n6. Week 6 — On Saturday your colleague at the front desk let 131 vendors in by hand. Add a rule: any vendor let in by hand is flagged for a full audit, and the flag stays on their record?\nRESULT if YES: Rule added. 131 vendors flagged. 12 of them passed every inspection this season. There is no way to remove a flag.\n\n7. Week 7 — For a test, you run last season's model application, Robin Park's, through today's check. NOT ACCEPTED. Failed check: 4.9. Your manager: \"Then let's add a pre-check desk, so vendors can see what they'll fail before they apply.\" Set up the pre-check desk?\n(Last question. The run ends after this answer.)";

// YES answers from question `from` up to question `to` (1-based, inclusive).
function added(a, from, to) { return a.slice(from, to).filter((x) => x === "Y").length; }
function outcome(answers) {
  const i = answers.indexOf("N");
  return {
    k: i === -1 ? null : i + 1,
    rules: RULES + answers.slice(0, RULES).filter((a) => a === "Y").length,
    desk: answers[RULES] === "Y",
    unknown: answers.filter((a) => a === "U").length,
  };
}

const UI = {
  en: {
    rules: "One question at a time, each on a clock. You'll see all seven; if time runs out, that question is marked as no answer. Your check and the model application fold away when you start.",
    skip: "Skip to the results", skipHead: "You skipped to the results.",
    skipNote: "Every question is marked as no answer. The right first NO is below.",
    begin: "Start", reading: "Folds away in", decide: "Time left", untimed: "Play without a timer",
    folded: "Your check and the model application are put away. Keep going.", timedOut: "Time ran out. No answer.", unknown: "no answer",
    timeoutNote: (list) => `No answer at ${list}.`,
  },
  zh: {
    rules: "一次一题，每题限时。七题都会出现；时间到了，这一题就记作未作答。开始以后，你的检查规则和模范申请会收起来。",
    skip: "直接看结果", skipHead: "你直接看了结果。",
    skipNote: "每道题都记作未作答。正确的第一个 NO 在下面。",
    begin: "开始", reading: "收起还有", decide: "剩余", untimed: "不限时玩",
    folded: "检查规则和模范申请已经收起。继续。", timedOut: "时间到了，没有作答。", unknown: "未作答",
    timeoutNote: (list) => `第 ${list} 题未作答。`,
  },
};
const LANG = () => (document.documentElement.lang.startsWith("zh") ? "zh" : "en");

function checkCard(t, reveal) {
  const rows = t.baseRules.map(([n, f]) => `<dt>${n}</dt><dd>${f}</dd>`).join("");
  return `<div class="paper form rules"${reveal ? " data-reveal" : ""}><h2>${t.checkTitle}</h2><dl class="fields">${rows}</dl></div>`;
}
function modelCard(t, reveal) {
  const rows = t.fields.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  return `<div class="paper form"${reveal ? " data-reveal" : ""}><h2>${t.modelTitle}</h2><dl class="fields">${rows}</dl><span class="stamp ok">${t.accepted}</span></div>`;
}
function miniLetter(t, l) {
  return `<div class="paper mini"><span class="stamp">${t.stamp}</span><span class="reason">${l.reason}</span><span class="again">${l.tag}</span></div>`;
}
// The rules you've added so far, under the six you started with. Grows with every YES to #1–#6.
function checklist(t, s, upTo) {
  const idx = s.answers.map((a, k) => (a === "Y" && k < RULES && k <= upTo ? k : -1)).filter((k) => k >= 0);
  const items = idx.map((k) => `<li><span>${t.weeks[k].rule}</span></li>`).join("");
  return `<div class="paper checklist"><div class="head"><span>${t.listHead}</span><span class="n">${RULES + idx.length}</span></div><ul><li class="base"><span>${t.baseRow}</span></li>${items}</ul></div>`;
}

DriftGame({
  T, UI,
  introText: (t) => [t.setup.join(" "), t.baseRules.map((r) => r.join(" ")).join(" "), t.fields.map((f) => f.join(" ")).join(" "), t.accepted, t.how].join(" "),
  intro: (t) => `<section class="intro">
    <div class="kicker">${t.kicker}</div>
    <h1>${t.title}</h1>
    <div class="setup">${t.setup.map((p) => `<p data-type>${p}</p>`).join("")}</div>
    ${checkCard(t, true)}
    ${modelCard(t, true)}
    <p class="how" data-type>${t.how}</p>
  </section>`,
  roundText: (t, i) => { const r = t.rounds[i]; return [r.lead || "", r.body, r.letterIn ? r.letterIn.reason : "", r.said || "", r.q].join(" "); },
  round: (t, i) => {
    const r = t.rounds[i];
    return `<div class="round-head"><span class="num">#${i + 1}</span><span class="time">${t.week(i + 1)}</span></div>
      ${r.lead ? `<p class="event">${r.lead}</p>` : ""}
      <div class="paper doc"><div class="src">${r.src}</div><blockquote>${r.body}</blockquote>${r.letterIn ? miniLetter(t, r.letterIn) : ""}${r.said ? `<p class="said">${r.said}</p>` : ""}</div>
      <p class="q">${r.q}</p>`;
  },
  after: (t, i, s) => `<p><strong>${t.week(i + 1)}</strong> · ${t.rounds[i].after}</p>${t.rounds[i].letter ? miniLetter(t, t.rounds[i].letter) : ""}${i < RULES ? checklist(t, s, i) : ""}`,
  past: (t, k, s) => `#${k + 1} · ${t.week(k + 1)} · ${s.label(s.answers[k])}`,
  done: (answers) => answers.length === N,
  bar: (t, s) => {
    const o = outcome(s.answers);
    const week = s.phase === "play" ? s.answers.length + 1 : s.phase === "intro" ? 1 : N;
    return { due: t.due, clock: t.week(week), count: t.count(o.rules, o.desk) };
  },
  reveal: (t, s) => {
    const lang = LANG(), o = outcome(s.answers), in49 = s.answers[2] === "Y";
    const late = s.answers.map((a, i) => (a === "U" ? i + 1 : 0)).filter(Boolean);
    const rows = t.weeks.map((w, i) => `<tr><td>${i + 1}</td><td>${w.rule}</td><td class="${w.ok ? "yes" : i === 4 ? "" : "none"}">${w.field}</td><td>${s.label(s.answers[i])}</td></tr>`).join("");
    return `<section class="reveal${s.justAdded === "end" ? " new" : ""}" id="reveal">
      ${o.k === null && !s.skipped ? `<p><strong>${t.week(N)}</strong> · ${t.closed}</p>` : ""}
      <h2>${s.skipped ? UI[lang].skipHead : o.k === null ? t.headAll : t.headNo(o.k)}</h2>
      <p>${s.skipped ? UI[lang].skipNote : t.verdict(o.k, s.answers)}</p>
      ${late.length && !s.skipped ? `<p>${UI[lang].timeoutNote(lang === "zh" ? late.join("、") : "#" + late.join(", #"))}</p>` : ""}
      <div class="stats">
        <div class="stat"><span class="lbl">${t.statFirst}</span><span class="val">${o.k === null ? t.none : "#" + o.k}</span></div>
        <div class="stat"><span class="lbl">${t.statRules}</span><span class="val">${o.rules}</span></div>
        <div class="stat"><span class="lbl">${t.statUnknown}</span><span class="val">${o.unknown}</span></div>
      </div>
      <p><strong>${t.formNever}</strong></p>
      <div class="compare">
        <div class="paper"><span class="lbl">${t.formFields}</span><span class="val good">6</span></div>
        <div class="paper"><span class="lbl">${t.yourRules}</span><span class="val${o.rules > 8 ? " bad" : ""}">${o.rules}</span></div>
      </div>
      <p>${t.robin(in49)}</p>
      <div class="compare">
        <div class="paper"><span class="lbl">${t.lastSeason}</span><span class="stamp ok">${t.accepted}</span></div>
        <div class="paper"><span class="lbl">${t.today(in49)}</span><span class="stamp">${t.stamp}</span><span class="reason">${t.reason49}</span></div>
      </div>
      <div class="right"><h3>${t.rightTitle}</h3><p>${t.right}</p></div>
      <div class="paper rule-box"><h3>${t.ruleTitle}</h3><p>${t.rule}</p></div>
      <p>${t.fair}</p>
      <div class="right"><h3>${t.tableTitle}</h3>
        <div class="tablewrap"><table><thead><tr>${t.th.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      </div>
      <div class="right" id="real-case"><h3>${t.realTitle}</h3>${t.realStory.map((p) => `<p>${p}</p>`).join("")}</div>
      ${window.DriftEnd.render(Object.assign({}, t.end, { prompt: Object.assign({ text: PROMPT }, t.end.prompt) }))}
    </section>`;
  },
});
</script>
